name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional public HTTPS backend URL (leave blank to use default Cloud Run backend)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Alya AI Companion Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove any accidental local .env or secret files
        run: |
          find . -maxdepth 2 -name ".env*" ! -name ".env.example" -type f -delete
          rm -f android/local.properties
          rm -rf android/app/build

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun (for bun.lock lockfile)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies from lockfile
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun install --frozen-lockfile || bun install
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build production web bundle (Vite)
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Sync web assets with Capacitor Android project
        run: npx cap sync android

      - name: Verify no .env or API keys leaked into Android web assets
        run: |
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERROR: Synced web assets missing at android/app/src/main/assets/public/index.html" >&2
            exit 1
          fi
          find android/app/src/main/assets/public -name ".env*" -type f -delete

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and ensure platform 34 is installed
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.5 with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Ensure Gradle wrapper is executable and initialized
        working-directory: android
        run: |
          chmod +x ./gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          ./gradlew --version

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Verify generated Debug APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not found at $APK_PATH" >&2
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alya-ai-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
